name: Build CloudHub (.app)

# 仅构建验证流水线：在 macOS(x64) 上 dotnet publish 出自包含 .app。
# 触发限定在 push 到 main / 手动触发 / release 发布，不在外部 PR 上跑（避免密钥泄露面）。
on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-macos:
    name: Build macOS .app (x64, self-contained)
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.400"

      - name: Publish (self-contained, osx-x64)
        run: >
          dotnet publish src/CloudHub.Desktop/CloudHub.Desktop.csproj
          -c Release -r osx-x64 --self-contained true

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudHub-macos-x64
          path: src/CloudHub.Desktop/bin/Release/net10.0/osx-x64/publish/CloudHub.app
          if-no-files-found: error
