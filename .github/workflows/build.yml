name: Build CloudHub (.app)

# 仅构建验证流水线：在 macOS(x64) 上 dotnet publish 出自包含 .app。
# 触发限定在 push 到 main / 手动触发 / release 发布，不在外部 PR 上跑（避免密钥泄露面）。
on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-macos:
    name: Build macOS .app (x64, self-contained)
    # macos-latest = arm64 机型，队列通常比快被弃用的 macos-13(x64) 短得多；
    # 仍发布 osx-x64，产物保持 x64 .app，与你本地一致。
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.400"

      - name: Publish (self-contained, osx-x64)
        run: >
          dotnet publish src/CloudHub.Desktop/CloudHub.Desktop.csproj
          -c Release -r osx-x64 --self-contained true

      # dotnet publish 只平铺 DLL+apphost，不会自动生成 .app 包，这里手动包成标准 bundle
      - name: Package .app bundle
        run: |
          set -euo pipefail
          PUBLISH="src/CloudHub.Desktop/bin/Release/net10.0/osx-x64/publish"
          APP="CloudHub.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS"
          cp -R "$PUBLISH/." "$APP/Contents/MacOS/"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>CFBundleName</key><string>CloudHub</string>
              <key>CFBundleDisplayName</key><string>CloudHub</string>
              <key>CFBundleIdentifier</key><string>com.codehub.cloudhub</string>
              <key>CFBundleVersion</key><string>1.0.0</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleExecutable</key><string>CloudHub</string>
              <key>LSMinimumSystemVersion</key><string>10.15</string>
              <key>NSHighResolutionCapable</key><true/>
            </dict>
          </plist>
          PLIST
          chmod +x "$APP/Contents/MacOS/CloudHub"
          echo "Packaged $APP ($(du -sh "$APP" | cut -f1))"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudHub-macos-x64
          path: CloudHub.app
          if-no-files-found: error
